[package]
name = "regex-engine"
version = "0.1.0"
edition = "2021"

[features]
debug = []

[[bin]]
name = "regex-engine"
path = "src/main.rs"

[[bin]]
name = "crash_demo"
path = "src/bin/crash_demo.rs"

[[bin]]
name = "crash_demo_worker"
path = "src/bin/crash_demo_worker.rs"

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "basic_bench"
harness = false

[[bench]]
name = "posix_bench"
harness = false