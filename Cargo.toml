[package]
name = "regex-engine"
version = "0.1.0"
edition = "2021"

[features]
debug = []
external-engines = ["dep:regex"]


# CLI
[[bin]]
name = "regex-engine"
path = "src/main.rs"


# Demo
[[example]]
name = "demo_match"
path = "examples/demo_match.rs"

[[example]]
name = "demo_parse"
path = "examples/demo_parse.rs"

[[example]]
name = "demo_crash"
path = "examples/demo_crash.rs"

[[example]]
name = "dataset_prepare"
path = "examples/dataset_prepare.rs"

[[example]]
name = "dataset_stats"
path = "examples/dataset_stats.rs"

# Brzozowski derivative: expression size per step
[[example]]
name = "demo_growth_deriv"
path = "examples/demo_growth_deriv.rs"

# Antimirov partial derivative: frontier size per input char
[[example]]
name = "demo_growth_pderiv"
path = "examples/demo_growth_pderiv.rs"

# Branch counts, and why simp's r + r = r never fires
[[example]]
name = "demo_simp_branches"
path = "examples/demo_simp_branches.rs"

# Sizes of the Regex produced by frontend translation
[[example]]
name = "demo_frontend_translation_sizes"
path = "examples/demo_frontend_translation_sizes.rs"

# One real corpus pattern per verified frontend behaviour
[[example]]
name = "demo_frontend_categories"
path = "examples/demo_frontend_categories.rs"

# Cross-parser agreement over the prepared dataset
[[example]]
name = "demo_parser_agreement"
path = "examples/demo_parser_agreement.rs"

# Worker for demo_parser_agreement: one isolated (parser, pattern, input)
# job per process, so a pathological case can be killed outright instead
# of orphaning an uncancellable thread (see that file's module doc comment)
[[example]]
name = "demo_parser_agreement_worker"
path = "examples/demo_parser_agreement_worker.rs"

# Reject-cause demo (replaces demo_canonical_approx_reject.rs: no more Approx)
[[example]]
name = "demo_canonical_reject"
path = "examples/demo_canonical_reject.rs"


# Benchmarks
[[bench]]
name = "bench_match"
harness = false

[[bench]]
name = "bench_parse"
harness = false

[[bench]]
name = "bench_dataset"
harness = false

[[bench]]
name = "bench_external"
harness = false
required-features = ["external-engines"]

[[bench]]
name = "bench_memory"
harness = false


# Tests

# Dependencies
[dependencies]
clap        = { version = "4.5", features = ["derive"] }
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
regex       = { version = "1", optional = true }
rand        = "0.8"
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
cc         = "1.0"
pkg-config = "0.3"

