[package]
name = "regex-engine"
version = "0.1.0"
edition = "2021"

[features]
debug = []
external-engines = ["dep:regex"]


# CLI
[[bin]]
name = "regex-engine"
path = "src/main.rs"


# Demo
[[example]]
name = "demo_match"
path = "examples/demo_match.rs"

[[example]]
name = "demo_posix"
path = "examples/demo_posix.rs"

[[example]]
name = "demo_crash"
path = "examples/demo_crash.rs"

[[example]]
name = "extract_dataset"
path = "examples/extract_dataset.rs"

[[example]]
name = "prepare_dataset"
path = "examples/prepare_dataset.rs"

[[example]]
name = "filter_dataset"
path = "examples/filter_dataset.rs"

# Figure 5.3
[[example]]
name = "demo_growth"
path = "examples/demo_growth.rs"

# Section 5.5 table.
[[example]]
name = "demo_branches"
path = "examples/demo_branches.rs"

# Figure 6.3
[[example]]
name = "demo_frontier"
path = "examples/demo_frontier.rs"

# Figure 7.4
[[example]]
name = "demo_lowered"
path = "examples/demo_lowered.rs"



# Benchmarks
[[bench]]
name = "bench_match"
harness = false

[[bench]]
name = "bench_parse"
harness = false

[[bench]]
name = "bench_dataset"
harness = false

[[bench]]
name = "bench_external"
harness = false
required-features = ["external-engines"]


# Tests

# Dependencies
[dependencies]
clap        = { version = "4.5", features = ["derive"] }
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
regex       = { version = "1", optional = true }
rand        = "0.8"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
cc         = "1.0"
pkg-config = "0.3"

