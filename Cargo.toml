[package]
name = "regex-engine"
version = "0.1.0"
edition = "2021"

[features]
debug = []


# CLI
[[bin]]
name = "regex-engine"
path = "src/main.rs"


# Demo
[[example]]
name = "demo_match"
path = "examples/demo_match.rs"

[[example]]
name = "demo_parse"
path = "examples/demo_parse.rs"

[[example]]
name = "demo_crash"
path = "examples/demo_crash.rs"

[[example]]
name = "dataset_prepare"
path = "examples/dataset_prepare.rs"

[[example]]
name = "dataset_stats"
path = "examples/dataset_stats.rs"

# Brzozowski derivative: expression size per step
[[example]]
name = "demo_growth_deriv"
path = "examples/demo_growth_deriv.rs"

# Antimirov partial derivative: frontier size per input char
[[example]]
name = "demo_growth_pderiv"
path = "examples/demo_growth_pderiv.rs"

# Branch counts, and why simp's r + r = r never fires
[[example]]
name = "demo_simp_branches"
path = "examples/demo_simp_branches.rs"

# Sizes of the Regex produced by frontend translation
[[example]]
name = "demo_translate_sizes"
path = "examples/demo_translate_sizes.rs"

# A spread of real S2ELab patterns translated and run on their own input
[[example]]
name = "demo_translate"
path = "examples/demo_translate.rs"

# One synthetic example per accepted frontend construct (breadth)
[[example]]
name = "demo_translate_categories"
path = "examples/demo_translate_categories.rs"

# Cross-parser agreement over the prepared dataset
[[example]]
name = "demo_parser_agreement"
path = "examples/demo_parser_agreement.rs"

# Worker for demo_parser_agreement:
# isolated (parser, pattern, input) job per process
[[example]]
name = "demo_parser_agreement_worker"
path = "examples/demo_parser_agreement_worker.rs"

# One hand-authored example per frontend rejection cause
[[example]]
name = "demo_translate_reject"
path = "examples/demo_translate_reject.rs"

# Worker for bench_corpus_time, bench_corpus_memory,
# bench_pathological_time, and bench_pathological_memory:
# isolated (parser, pattern, input) job per process
[[example]]
name = "bench_worker"
path = "examples/bench_worker.rs"


# Benchmarks
[[bench]]
name = "bench_corpus_time"
harness = false

[[bench]]
name = "bench_corpus_memory"
harness = false

[[bench]]
name = "bench_corpus_translate"
harness = false

[[bench]]
name = "bench_pathological_time"
harness = false

[[bench]]
name = "bench_pathological_memory"
harness = false

[[bench]]
name = "bench_pathological_translate"
harness = false


# Tests

# Dependencies
[dependencies]
clap        = { version = "4.5", features = ["derive"] }
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
rand        = "0.8"
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
